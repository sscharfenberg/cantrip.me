# cantrip.me — Postgres for the end-to-end test suite
# ===================================================
# THIS IS NOT A DEVELOPMENT DATABASE. It exists for one reason: the Playwright
# suite drives the real app, and the app's deck-building core needs the real
# engine — `DeckCardSearchService` and `CommandZoneService` filter colour
# identity with regular expressions, which SQLite cannot run. That is the same
# engine split `phpunit.xml` already encodes as the `Local` (SQLite) and
# `Staging` (Postgres) suites.
#
# Local development still happens against staging (see CLAUDE.md, "Staging
# Server as Dev Environment"). Nothing here changes that, and nothing here is
# reachable from the app's normal `.env`.
#
#   npm run e2e:db:up      # start it and wait until it answers
#   npm run e2e:db:down    # stop it and discard everything in it
#
# See docs/testing.md for the full picture.

name: cantrip-e2e

services:
    # Postgres 17 — the major staging and production run, because the whole
    # point of this container is to be the same SQL dialect. A test that passes
    # here against a different major proves less than it appears to.
    db:
        image: postgres:17
        environment:
            POSTGRES_DB: cantrip_e2e
            POSTGRES_USER: cantrip_e2e
            # Throwaway credentials for a throwaway database that is only ever
            # reachable from this machine. Kept in the file rather than in an
            # `.env` on purpose: there is no secret here to leak, and a
            # placeholder that looks like a secret invites someone to treat the
            # container as though it held real data.
            POSTGRES_PASSWORD: cantrip_e2e
            # The ICU root locale, as staging and production are created with.
            # It decides how `ORDER BY name` sorts — accented and lower-case
            # names next to their plain spellings, not after `Z` — so a
            # database built on the image's libc default would sort differently
            # from the servers it stands in for.
            POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und
        ports:
            # 5499, AND THE CHOICE IS THE LOAD-BEARING LINE IN THIS FILE.
            #
            # Not 5432: another local project's development Postgres lives
            # there, and on a matching port an e2e run would point
            # `migrate:fresh` at it.
            #
            # And nothing an ssh tunnel uses either. `~/.ssh/config` gives the
            # `cantrip` host a `LocalForward 3307 localhost:3306` — an earlier
            # version of this suite listened on exactly that port, so an open
            # ssh session to staging made its database answer where this
            # container was expected. Only the credentials differed, which is
            # far too thin a thing to be standing between a test run and
            # staging. See `assertIsE2EDatabase` in
            # tests/e2e/support/environment.ts for the second line of defence.
            #
            # Bound to loopback, not to every interface: an open Postgres on
            # cantrip_e2e/cantrip_e2e is found by a subnet scan in seconds, and
            # a laptop is not always on a network you trust.
            - "127.0.0.1:5499:5432"
        tmpfs:
            # IN RAM, WITH NO VOLUME, which is a correctness choice before it is
            # a speed one. Every e2e run starts with `migrate:fresh`, so nothing
            # here is ever meant to outlive it — and a persistent volume would
            # let a half-finished run leave state that the next one silently
            # inherits, which is the exact class of failure this suite exists to
            # catch rather than produce. Stopping the container is a guaranteed
            # reset. It is also considerably faster, which is the bonus.
            - /var/lib/postgresql/data
        healthcheck:
            # Over TCP, not the socket. On first boot the image initialises the
            # cluster with a temporary server that listens on its socket only,
            # then restarts it — a socket check goes green during that window,
            # and the first migration then fails on a server that was about to
            # go away.
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cantrip_e2e", "-d", "cantrip_e2e"]
            interval: 3s
            timeout: 3s
            retries: 30
            start_period: 30s
