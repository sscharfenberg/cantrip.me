version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@*/eslint-*"

      # `@vitest/coverage-v8` pins its `vitest` peer to an exact version rather than a
      # range — coverage-v8 5.0.0 asks for `vitest: "5.0.0"`, flat. So a PR bumping one
      # of the two on its own cannot resolve at any version and dies in `npm ci` on
      # ERESOLVE before a single test runs, and a rebase can't save it. Grouping them is
      # what makes a Vitest major installable at all, not a tidiness preference; it stays
      # for as long as that peer is an exact pin.
      #
      # `vite` is deliberately *not* in here. Vitest's peer on it is a genuine range
      # (`^6.4.0 || ^7.0.0 || ^8.0.0`), so Vite can and should move on its own schedule.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # TypeScript is held on 6.0 because 7.0, the native (Go) port, ships no compiler API
      # — the package's main entry exports only its version — and two tools here drive
      # the compiler through that API:
      # - `typescript-eslint` (parser and eslint-plugin, both reached through
      #   `@vue/eslint-config-typescript`) says so in its peer range: `typescript:
      #   ">=4.8.4 <6.1.0"`, which 8.72.0, their latest, still declares. A bump past it
      #   fails `npm ci` on the peer conflict before a single file compiles.
      # - `vue-tsc` asks only for `>=5.0.0`, but that range predates 7.0 rather than
      #   covering it: it type-checks `.vue` files through the same missing API, so it
      #   would install and then fail.
      # So `~6.0.x` in package.json is a ceiling, not a preference.
      #
      # A version range rather than `update-types: semver-major`, because the major is not
      # what breaks: a 6.1 would violate that peer exactly as 7.x does (none has been
      # published — 7.0.2 followed 6.0.3), and ignoring only majors would propose it.
      #
      # TypeScript 7.1 brings a new API (beta 2026-10-20). Delete this entry once both
      # tools ship stable support for it: typescript-eslint is building it in
      # typescript-eslint/typescript-eslint#12803, Vue in vuejs/language-tools#6170 — a
      # 7.1 content mapper that may let plain `tsc` check `.vue` files instead of `vue-tsc`.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
