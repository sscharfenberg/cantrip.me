version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@*/eslint-*"

      # `@vitest/coverage-v8` pins its `vitest` peer to an exact version rather than a
      # range — coverage-v8 5.0.0 asks for `vitest: "5.0.0"`, flat. So a PR bumping one
      # of the two on its own cannot resolve at any version and dies in `npm ci` on
      # ERESOLVE before a single test runs, and a rebase can't save it. Grouping them is
      # what makes a Vitest major installable at all, not a tidiness preference; it stays
      # for as long as that peer is an exact pin.
      #
      # `vite` is deliberately *not* in here. Vitest's peer on it is a genuine range
      # (`^6.4.0 || ^7.0.0 || ^8.0.0`), so Vite can and should move on its own schedule.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # TypeScript is held below 6.1 by one peer range — the `typescript-eslint` packages
      # (parser and eslint-plugin, both reached through `@vue/eslint-config-typescript`)
      # declare `typescript: ">=4.8.4 <6.1.0"`, and 8.67.0, their latest, still does. So
      # `~6.0.x` in package.json is a ceiling, not a preference, and a bump past it fails
      # `npm ci` on the peer conflict before a single file compiles.
      #
      # A version range rather than `update-types: semver-major`, because the major is not
      # what breaks: 6.1 violates that peer exactly as 7.x does, so ignoring only majors
      # would keep proposing a minor that cannot install. Delete this entry outright when
      # the parser widens its range — nothing else here constrains TypeScript, `vue-tsc`
      # asks only for `>=5.0.0`.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
