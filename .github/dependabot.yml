version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@*/eslint-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
